# Pages CMS Konfiguration für RLC 1952 Recklinghausen
# Wird von https://app.pagescms.org gelesen (Redaktion über den Browser).
# Generierung der Detailseiten + Übersichtsdaten übernimmt automatisch
# .github/workflows/regen-news.yml nach jedem Commit an news_archive.json.
#
# WICHTIG: Alle Felder von news_archive.json (id, url, title, date,
# content_text, content_html, images) MÜSSEN hier definiert bleiben!
# Pages CMS schreibt beim Speichern nur die hier definierten Felder zurück —
# fehlt ein Feld hier, würde es aus allen Beiträgen gelöscht werden.
media:
  - name: uploads
    label: Bilder
    input: assets/images/uploads
    output: /assets/images/uploads

content:
  - name: news
    label: Aktuelles / News
    type: file
    path: news_archive.json
    format: json
    list: true
    fields:
      - name: id
        label: ID
        type: string
        readonly: true
        description: Wird beim Veröffentlichen automatisch vergeben (fortlaufend).
      - name: url
        label: URL (intern)
        type: string
        readonly: true
        hidden: true
      - name: title
        label: Titel
        type: string
        required: true
        description: Kurz und aussagekräftig, max. 70 Zeichen. Wird beim Veröffentlichen automatisch in GROSSBUCHSTABEN gesetzt.
      - name: date
        label: Datum
        type: string
        required: true
        pattern:
          regex: '^[0-9]{1,2}\. (Januar|Februar|März|April|Mai|Juni|Juli|August|September|Oktober|November|Dezember) [0-9]{4}$'
          message: "Bitte als deutsches Datum eingeben, z. B. 9. Oktober 2026"
        description: Deutsches Datum mit Punkt, z. B. 9. Oktober 2026
      - name: content_text
        label: Text
        type: text
        required: true
        description: Der Bericht in 2–3 Absätzen. Absätze durch eine Leerzeile trennen.
      - name: content_html
        label: HTML (intern)
        type: text
        hidden: true
      - name: images
        label: Bilder (Querformat)
        type: object
        list: true
        description: Das erste Bild wird das Hauptbild des Beitrags.
        fields:
          - name: remote
            label: Quelle (intern)
            type: string
            hidden: true
          - name: local
            label: Bilddatei
            type: image

actions:
  - name: regen-news
    label: News neu generieren
    workflow: regen-news.yml
    cancelable: false
