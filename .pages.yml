# Pages CMS Konfiguration für RLC 1952 Recklinghausen
# Wird von https://app.pagescms.org gelesen (Redaktion über den Browser).
# Generierung der Detailseiten + Übersichtsdaten übernimmt automatisch
# .github/workflows/regen-news.yml nach jedem Commit an news_archive.json.
#
# WICHTIG: Alle Felder von news_archive.json (id, url, title, date,
# content_text, content_html, images) MÜSSEN hier definiert bleiben!
# Pages CMS schreibt beim Speichern nur die hier definierten Felder zurück —
# fehlt ein Feld hier, würde es aus allen Beiträgen gelöscht werden.
media:
  - name: uploads
    label: Bilder
    input: assets/images/uploads
    output: /assets/images/uploads
  - name: dokumente
    label: Dokumente (PDF)
    input: assets/pdf
    output: /assets/pdf
  - name: website-images
    label: Website-Bilder
    input: assets/images
    output: /assets/images
  - name: trainer
    label: Trainerfotos
    input: assets/images/trainer
    output: /assets/images/trainer
  - name: posters
    label: Poster & Termin-PDFs
    input: Termine
    output: /Termine

content:
  - name: news
    label: Aktuelles / News
    type: file
    path: news_archive.json
    format: json
    list: true
    fields:
      - name: id
        label: ID
        type: string
        readonly: true
        description: Wird beim Veröffentlichen automatisch vergeben (fortlaufend).
      - name: url
        label: URL (intern)
        type: string
        readonly: true
        hidden: true
      - name: title
        label: Titel
        type: string
        required: true
        description: Kurz und aussagekräftig, max. 70 Zeichen. Wird beim Veröffentlichen automatisch in GROSSBUCHSTABEN gesetzt.
      - name: date
        label: Datum
        type: string
        required: true
        pattern:
          regex: '^[0-9]{1,2}\. (Januar|Februar|März|April|Mai|Juni|Juli|August|September|Oktober|November|Dezember) [0-9]{4}$'
          message: "Bitte als deutsches Datum eingeben, z. B. 9. Oktober 2026"
        description: Deutsches Datum mit Punkt, z. B. 9. Oktober 2026
      - name: content_text
        label: Text
        type: text
        required: true
        description: Der Bericht in 2–3 Absätzen. Absätze durch eine Leerzeile trennen.
      - name: content_html
        label: HTML (intern)
        type: text
        hidden: true
      - name: images
        label: Bilder (Querformat)
        type: object
        list: true
        description: Das erste Bild wird das Hauptbild des Beitrags.
        fields:
          - name: remote
            label: Quelle (intern)
            type: string
            hidden: true
          - name: local
            label: Bilddatei
            type: image

  - name: home
    label: Startseite
    type: file
    path: assets/data/home.json
    format: json
    fields:
      - name: hero
        label: Kopfbereich (Hero)
        type: object
        fields:
          - name: kickerCity
            label: Kicker links (Ort)
            type: string
          - name: kickerClaim
            label: Kicker rechts (Claim)
            type: string
          - name: titleLine1
            label: Titel Zeile 1
            type: string
          - name: titleLine2
            label: Titel Zeile 2 (kursiv)
            type: string
          - name: lead
            label: Einleitungstext
            type: text
          - name: image
            label: Hero-Bild
            type: object
            fields:
              - name: src
                label: Bilddatei
                type: image
                options:
                  media: website-images
              - name: alt
                label: Bildbeschreibung (barrierefrei)
                type: string
              - name: copyright
                label: Bildnachweis
                type: string
      - name: newsSectionTitle
        label: Überschrift „Aktuelles"
        type: string
      - name: datesPanelTitle
        label: Überschrift Termine-Box
        type: string
      - name: shortcutsTitle
        label: Überschrift „Schnelle Wege"
        type: string
      - name: shortcuts
        label: Schnelle Wege (Links)
        type: object
        list: true
        fields:
          - name: label
            label: Beschriftung
            type: string
          - name: cta
            label: Hinweis rechts
            type: string
          - name: href
            label: Ziel-Link
            type: string
      - name: visitLabel
        label: Abschnitts-Label „Rund um den Verein"
        type: string
      - name: visitCards
        label: Karten „Rund um den Verein"
        type: object
        list: true
        fields:
          - name: tag
            label: Kleiner Titel (Tag)
            type: string
          - name: title
            label: Überschrift
            type: string
          - name: text
            label: Kurztext
            type: string
          - name: linkLabel
            label: Linktext
            type: string
          - name: href
            label: Ziel-Link
            type: string
          - name: external
            label: Externer Link (neuem Tab öffnen)
            type: boolean

  - name: termine
    label: Termine & Wettkämpfe
    type: file
    path: assets/data/events.json
    format: json
    fields:
      - name: page
        label: Seitentexte
        type: object
        fields:
          - name: title
            label: Seitenüberschrift
            type: string
          - name: lead
            label: Einleitungstext
            type: text
          - name: overviewTitle
            label: Überschrift Jahresüberblick
            type: string
          - name: emptyNote
            label: Hinweistext (keine Termine)
            type: text
          - name: ctaTitle
            label: Abschluss-Überschrift
            type: string
          - name: ctaText
            label: Abschluss-Text
            type: text
          - name: posterLabel
            label: Poster-Linktext
            type: string
          - name: posterHref
            label: Terminposter (PDF)
            type: file
            options:
              media: posters
      - name: termine
        label: Termine (Liste)
        type: object
        list: true
        fields:
          - name: date
            label: Datum (Kalender)
            type: date
            required: true
          - name: kicker
            label: Kategorie (z. B. Meeting)
            type: string
          - name: title
            label: Titel
            type: string
            required: true
          - name: teaser
            label: Kurzbeschreibung
            type: text
          - name: was
            label: Was
            type: string
          - name: wo
            label: Wo
            type: string
          - name: wer
            label: Wer
            type: string
          - name: anmeldung
            label: Anmeldung
            type: string
          - name: featured
            label: Hervorgehobene Karte
            type: boolean
          - name: link
            label: Zusatz-Link (optional)
            type: object
            fields:
              - name: href
                label: Link-Ziel
                type: string
              - name: label
                label: Linktext
                type: string

  - name: team
    label: Trainerteam
    type: file
    path: assets/data/team.json
    format: json
    fields:
      - name: page
        label: Seitentexte
        type: object
        fields:
          - name: title
            label: Seitenüberschrift
            type: string
          - name: lead
            label: Einleitungstext
            type: text
          - name: directoryTitle
            label: Überschrift Teamverzeichnis
            type: string
          - name: ctaTitle
            label: Abschluss-Überschrift
            type: string
          - name: ctaText
            label: Abschluss-Text
            type: text
          - name: introImage
            label: Intro-Bild
            type: object
            fields:
              - name: src
                label: Bilddatei
                type: image
                options:
                  media: website-images
              - name: alt
                label: Bildbeschreibung (barrierefrei)
                type: string
      - name: trainerPhotos
        label: Trainerfotos (Name exakt wie im Trainingsplan)
        type: object
        list: true
        fields:
          - name: name
            label: Trainername
            type: string
          - name: image
            label: Foto
            type: image
            options:
              media: trainer

  - name: training
    label: Trainingszeiten & Sportgruppen
    type: file
    path: assets/data/training.json
    format: json
    fields:
      - name: meta
        label: Saison-Infos
        type: object
        fields:
          - name: seasonLabel
            label: Saison (z. B. Sommersaison 2026)
            type: string
          - name: validRange
            label: Gültigkeitszeitraum
            type: string
          - name: performanceNote
            label: Hinweis Leistungsgruppen (Kurzform)
            type: string
          - name: contactEmail
            label: Kontakt-E-Mail
            type: string
      - name: page
        label: Seitentexte
        type: object
        fields:
          - name: title
            label: Seitenüberschrift
            type: string
          - name: lead
            label: Einleitungstext
            type: text
          - name: planTitle
            label: Überschrift Wochenplan
            type: string
          - name: introImage
            label: Intro-Bild
            type: object
            fields:
              - name: src
                label: Bilddatei
                type: image
                options:
                  media: website-images
              - name: alt
                label: Bildbeschreibung (barrierefrei)
                type: string
          - name: pdfHref
            label: Trainingszeiten-PDF (Dateipfad)
            type: string
            readonly: true
          - name: validityNote
            label: Gültigkeit-Hinweis
            type: text
          - name: performanceNoteText
            label: Leistungsgruppen-Hinweis
            type: text
          - name: tableIntro
            label: Tabellen-Einleitung
            type: text
      - name: groups
        label: Trainingsgruppen (Liste)
        type: object
        list: true
        fields:
          - name: day
            label: Wochentag
            type: select
            options:
              values: [Montag, Dienstag, Mittwoch, Donnerstag, Freitag, Samstag, Sonntag]
          - name: time
            label: Uhrzeit (z. B. 17:00 - 18:30 Uhr)
            type: string
          - name: group
            label: Gruppe
            type: string
          - name: year
            label: Jahrgang
            type: string
          - name: location
            label: Ort
            type: string
          - name: trainers
            label: Trainerinnen und Trainer
            type: string
            list: true
          - name: performance
            label: Wettkampf- und Leistungstraining
            type: boolean

actions:
  - name: regen-news
    label: News neu generieren
    workflow: regen-news.yml
    cancelable: false
