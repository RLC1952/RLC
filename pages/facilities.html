<!DOCTYPE html>
<html class="light" lang="de">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Sportstätten | RLC 1952</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/images/favicon/favicon-192.png" />
    <link rel="apple-touch-icon" href="/assets/images/favicon/apple-touch-icon.png" />
    <meta
        name="description"
        content="Übersicht der realen Trainingsorte des Recklinghäuser Leichtathletik Clubs 1952 e.V. auf Basis des aktuellen Trainingsplans."
    />
    <link href="../assets/css/design-tokens.css" rel="stylesheet" />
    <link href="../assets/css/shell.css" rel="stylesheet" />
    <link href="../assets/css/subpages.css?v=15" rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&amp;family=Montserrat:wght@700;900&amp;display=swap"
        rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <script src="../assets/js/components.js?v=3"></script>
    <script src="../assets/js/training_schedule.js?v=4" data-training-src="../assets/data/training.json"></script>
</head>
<body class="subpage subpage-facilities min-h-screen">
    <header data-shared-shell-placeholder></header>
    <main class="subpage-main">
        <div class="subpage-stack">
            <section class="subpage-intro subpage-intro--visual" aria-labelledby="facilities-page-title">
                <div class="subpage-intro__content">
                    <span class="subpage-eyebrow">Sportstätten</span>
                    <h1 id="facilities-page-title" class="subpage-display">Unsere Trainingsorte im Überblick.</h1>
                    <p class="subpage-lead">Adresse, kurzer Eindruck und Google-Maps-Link zu den aktuellen Trainingsorten.</p>
                    <div class="subpage-meta-row" id="facilities-meta-row" aria-label="Schnellüberblick zu den Trainingsorten"></div>
                    <div class="subpage-actions">
                        <a href="contact.html#contact" class="subpage-button subpage-button--secondary">Rückfrage zum Ort <span class="material-icons-round" aria-hidden="true">arrow_forward</span></a>
                    </div>
                </div>
                <figure class="subpage-intro__visual">
                    <img src="../assets/images/rlc-sportstaetten-stadion.jpg" alt="Stadion Hohenhorst als zentrale Sportstätte des RLC 1952" width="1757" height="920" loading="lazy" decoding="async" />
                    <figcaption class="subpage-photo-credit">© RVR, 2020, DL-DE/BY-2-0</figcaption>
                </figure>
            </section>

            <section class="subpage-section" aria-labelledby="facilities-directory-title">
                <div class="subpage-title-row">
                    <div>
                        <span class="subpage-eyebrow">Standortübersicht</span>
                        <h2 id="facilities-directory-title" class="subpage-title">Die Trainingsorte des Vereins.</h2>
                    </div>
                </div>
                <div class="subpage-card-grid subpage-card-grid--facilities" id="facilities-grid"></div>
            </section>
        </div>
    </main>
    <footer data-shared-footer-placeholder></footer>

    <script>
            document.addEventListener('DOMContentLoaded', () => {
                const bootFacilities = () => {
                const schedule = Array.isArray(window.trainingSchedule) ? window.trainingSchedule : [];
                const grid = document.getElementById('facilities-grid');
            const metaRow = document.getElementById('facilities-meta-row');

            const unique = (values) => [...new Set(values.filter(Boolean))];

            const locationDefinitions = [
                {
                    name: 'Stadion Hohenhorst',
                    badge: 'Hauptstandort',
                    category: 'OUTDOOR',
                    accent: 'facility-accent--stadium',
                    image: '../assets/images/rlc-sportstaetten-stadion.jpg',
                    photoCredit: '© RVR, 2020, DL-DE/BY-2-0',
                    summary: 'Unser Hauptstandort für Bahntraining, Wettkampfvorbereitung und viele Gruppen.',
                    copy: 'Kinder, Jugend und Erwachsene trainieren hier regelmäßig auf der Bahn und im Außenbereich.',
                    address: 'Am Stadion 1, 45659 Recklinghausen',
                    mapsUrl: 'https://www.google.com/maps/search/?api=1&query=Stadion%20Hohenhorst%20Am%20Stadion%201%2045659%20Recklinghausen',
                    match: (entry) => entry.location.includes('Stadion Hohenhorst') && !entry.location.includes('Kraftraum')
                },

                {
                    name: 'Vestische Arena Alfons Schütt',
                    badge: '5-fach Sporthalle',
                    category: 'Indoor',
                    accent: 'facility-accent--hall',
                    summary: 'Die 5-fach Sporthalle für ausgewählte Hallenzeiten und Gruppen.',
                    copy: 'Die Halle wird für konkrete Termine und Gruppen aus dem Wochenplan genutzt.',
                    address: 'Campus Blumenthal 5, 45665 Recklinghausen',
                    mapsUrl: 'https://www.google.com/maps/search/?api=1&query=Vestische%20Arena%20Alfons%20Sch%C3%BCtt%20Campus%20Blumenthal%205%2045665%20Recklinghausen',
                    match: (entry) => entry.location.includes('5-fach Sporthalle')
                },
                {
                    name: 'Sporthalle Hohenzollernschule',
                    badge: 'Hohenzollernhalle',
                    category: 'Indoor',
                    accent: 'facility-accent--hall',
                    summary: 'Innenort für Senioren- und Ausweichtraining.',
                    copy: 'Hier finden Hallenzeiten, Gesundheitssport und ergänzende Einheiten statt.',
                    address: 'Hohenzollernstraße 3, 45659 Recklinghausen',
                    mapsUrl: 'https://www.google.com/maps/search/?api=1&query=Sporthalle%20Hohenzollernschule%20Hohenzollernstra%C3%9Fe%203%2045659%20Recklinghausen',
                    match: (entry) => entry.location.includes('Hohenzollernhalle')
                }
            ];

            const cards = locationDefinitions.map((location) => {
                const entries = schedule.filter(location.match);
                const groups = unique(entries.map((entry) => entry.group));
                const trainerCount = unique(entries.flatMap((entry) => entry.trainers || [])).length;

                return {
                    ...location,
                    groups,
                    trainerCount
                };
            });

            metaRow.innerHTML = [
                {
                    icon: 'place',
                    label: 'Orte',
                    value: `${cards.length} Orte`
                },
                {
                    icon: 'groups',
                    label: 'Gruppen',
                    value: `${unique(schedule.map((entry) => entry.group)).length} Trainingsgruppen`
                }
            ].map((item) => `
                <span class="subpage-meta">
                    <span class="material-icons-round" aria-hidden="true">${item.icon}</span>
                    <strong>${item.label}:</strong> ${item.value}
                </span>
            `).join('');

            grid.innerHTML = cards.map((location) => `
                <article class="facility-card">
                    <div class="facility-card__button">
                        <div class="facility-card__media ${location.accent}" ${location.image ? `style="background-image: linear-gradient(135deg, rgba(11, 31, 61, 0.34), rgba(11, 31, 61, 0.08)), url('${location.image}')"` : 'aria-hidden="true"'}>
                            <span class="facility-card__badge">${location.badge}</span>
                            ${location.image ? '' : '<span class="facility-card__placeholder"><span class="material-icons-round" aria-hidden="true">photo_camera</span>Foto folgt</span>'}
                            ${location.photoCredit ? `<span class="subpage-photo-credit">${location.photoCredit}</span>` : ''}
                        </div>
                        <div class="facility-card__body">
                            <div class="facility-card__header">
                                <div>
                                    <h3>${location.name}</h3>
                                    <p>${location.summary}</p>
                                </div>
                                <span class="facility-card__category">${location.category}</span>
                            </div>
                            <p class="facility-card__copy">${location.copy}</p>
                            <div class="facility-card__footer">
                                <span class="facility-card__address">${location.address}</span>
                                <a class="facility-card__action" href="${location.mapsUrl}" target="_blank" rel="noopener">Google Maps <span class="material-icons-round" aria-hidden="true">open_in_new</span></a>
                            </div>
                        </div>
                    </div>
                </article>
            `).join('');

                        };

                        const onTrainingData = () => {
                            document.removeEventListener('rlc:training-data', onTrainingData);
                            bootFacilities();
                        };
                        if (window.trainingSchedule) {
                            bootFacilities();
                        } else {
                            document.addEventListener('rlc:training-data', onTrainingData);
                        }
                    });
                </script>
</body>
</html>
